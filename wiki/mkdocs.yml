site_name: H-Clusters Wiki
site_description: Concepts, methods and techniques behind the h_clusters experiment
docs_dir: pages
# Broken links and anchors fail `build --strict`.
validation:
  anchors: warn
# Snippets and charts included from here; rebuild the live preview when they change.
watch:
  - examples

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

plugins:
  - search
  # Japanese pages are page.ja.md next to page.md; missing ones fall back to English.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_name: H-Clusters ウィキ
          site_description: h_clusters 実験の背後にある概念・手法・技法
          nav_translations:
            Home: ホーム
            Foundations: 基礎
            Methods: 計算手法
            Techniques: 計算技法
            Pitfalls: 落とし穴
            High-throughput computing: ハイスループット計算
            Writing pages: ページの書き方
            Schrödinger equation: シュレーディンガー方程式
            Born–Oppenheimer approximation: ボルン–オッペンハイマー近似
            Potential energy surface: ポテンシャルエネルギー曲面
            Spin and multiplicity: スピンと多重度
            Units: 単位
            Chemical and van der Waals bonds: 化学結合とファンデルワールス結合
            Hartree–Fock: ハートリー–フォック法
            Density functional theory: 密度汎関数理論
            MP2: MP2
            Coupled cluster: 結合クラスター法
            Diffusion Monte Carlo: 拡散モンテカルロ法
            Semi-empirical tight binding (GFN2-xTB): 半経験的タイトバインディング (GFN2-xTB)
            Basis sets: 基底関数系
            Resolution of the identity (RI): 恒等分解 (RI)
            Geometry optimization: 構造最適化
            Frequencies and the Hessian: 振動数とヘッセ行列
            Zero-point energy: 零点エネルギー
            Thermochemistry: 熱化学
            Global structure search: 大域的構造探索
            Point groups and symmetry: 点群と対称性
            Fragmentation channels: 解離チャネル
            Ionization energy and electron affinity: イオン化エネルギーと電子親和力
            Self-interaction error: 自己相互作用誤差
            Missing dispersion: 分散力の欠如
            Missing diffuse functions: 分散関数の欠如
            'Finite-basis "binding" of unbound anions': 有限基底による非束縛アニオンの見かけの「束縛」
            Spin contamination: スピン汚染
            Quantum nuclear effects: 原子核の量子効果
            Job hashing and deduplication: ジョブのハッシュ化と重複排除
            Provenance and resumability: 来歴管理と再開可能性
            Method ladders: 手法のはしご
            Selection barriers: 選抜バリア
            Resource budgeting: 計算資源の配分

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Unicode-aware, so Japanese headings get readable anchors.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          normalize: NFKC
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Pages include runnable code and generated charts from wiki/examples.
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# KaTeX renders the $...$ / $$...$$ math produced by arithmatex.
extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Every page must be listed here (see "Writing pages").
nav:
  - Home: index.md
  - Foundations:
      - foundations/index.md
      - Schrödinger equation: foundations/schrodinger-equation.md
      - Born–Oppenheimer approximation: foundations/born-oppenheimer.md
      - Potential energy surface: foundations/potential-energy-surface.md
      - Chemical and van der Waals bonds: foundations/chemical-and-van-der-waals-bonds.md
      - Spin and multiplicity: foundations/spin-and-multiplicity.md
      - Units: foundations/units.md
  - Methods:
      - methods/index.md
      - Hartree–Fock: methods/hartree-fock.md
      - Density functional theory: methods/dft.md
      - MP2: methods/mp2.md
      - Coupled cluster: methods/coupled-cluster.md
      - Diffusion Monte Carlo: methods/diffusion-monte-carlo.md
      - Semi-empirical tight binding (GFN2-xTB): methods/xtb.md
      - Basis sets: methods/basis-sets.md
      - Resolution of the identity (RI): methods/resolution-of-identity.md
  - Techniques:
      - techniques/index.md
      - Geometry optimization: techniques/geometry-optimization.md
      - Frequencies and the Hessian: techniques/frequencies.md
      - Zero-point energy: techniques/zero-point-energy.md
      - Thermochemistry: techniques/thermochemistry.md
      - Global structure search: techniques/structure-search.md
      - Point groups and symmetry: techniques/point-groups.md
      - Fragmentation channels: techniques/fragmentation.md
      - Ionization energy and electron affinity: techniques/ionization-and-electron-affinity.md
  - Pitfalls:
      - pitfalls/index.md
      - Self-interaction error: pitfalls/self-interaction-error.md
      - Missing dispersion: pitfalls/dispersion.md
      - Missing diffuse functions: pitfalls/diffuse-functions.md
      - 'Finite-basis "binding" of unbound anions': pitfalls/unbound-anions.md
      - Spin contamination: pitfalls/spin-contamination.md
      - Quantum nuclear effects: pitfalls/quantum-nuclear-effects.md
  - High-throughput computing:
      - htc/index.md
      - Job hashing and deduplication: htc/job-hashing.md
      - Provenance and resumability: htc/provenance.md
      - Method ladders: htc/method-ladder.md
      - Selection barriers: htc/selection-barriers.md
      - Resource budgeting: htc/resource-budgeting.md
  - Writing pages: writing-pages.md
