site_name: H-Clusters Wiki
site_description: Concepts, methods and techniques behind the h_clusters experiment
docs_dir: pages

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  # Pages include runnable code and generated charts from wiki/examples.
  - pymdownx.snippets:
      base_path: [examples]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# KaTeX renders the $...$ / $$...$$ math produced by arithmatex.
extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Every page must be listed here (see "Writing pages").
nav:
  - Home: index.md
  - Foundations:
      - foundations/index.md
      - Potential energy surface: foundations/potential-energy-surface.md
  - Methods:
      - methods/index.md
      - Hartree–Fock: methods/hartree-fock.md
  - Techniques: techniques/index.md
  - Pitfalls: pitfalls/index.md
  - High-throughput computing: htc/index.md
  - Writing pages: writing-pages.md
