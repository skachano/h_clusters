# Static site on GitHub Pages (doc/Plan.md, Phase 9): the web app built in static mode, plus
# the data exported by scripts/publish-data.sh into the newest "data-*" release, plus the
# wiki under /<repo>/wiki/ (Japanese under wiki/ja/).
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "wiki/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.data.outputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest data release
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.createdAt) | last | .tagName')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            # Not an error: the site cannot be built before the first data release.
            echo "::notice::no data-* release yet: run scripts/publish-data.sh, then this workflow again"
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern site-data.tar.gz --dir /tmp

      - uses: actions/setup-node@v4
        if: steps.data.outputs.tag != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the static app
        if: steps.data.outputs.tag != ''
        working-directory: web
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_OUTPUTS_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.data.outputs.tag }}/outputs.tar.xz
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -xzf /tmp/site-data.tar.gz -C dist
          test -f dist/data/manifest.json

      # The docs image of compose.yaml (pinned MkDocs Material + i18n). Its app: links point
      # at the app's hash routes on this site.
      - name: Build the wiki
        if: steps.data.outputs.tag != ''
        run: |
          docker build -t hclust-docs wiki
          docker run --rm -e APP_URL=/${{ github.event.repository.name }}/#/ \
            -v "$PWD/wiki:/docs" -v "$PWD/web/dist:/out" hclust-docs build --strict -d /out/wiki
          test -f web/dist/wiki/index.html && test -f web/dist/wiki/ja/index.html

      - uses: actions/configure-pages@v5
        if: steps.data.outputs.tag != ''
      - uses: actions/upload-pages-artifact@v3
        if: steps.data.outputs.tag != ''
        with:
          path: web/dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
