# Static site on GitHub Pages (doc/Plan.md, Phase 9): the web app built in static mode, plus
# the data exported by scripts/publish-data.sh into the newest "data-*" release.
name: Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the newest data release
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | startswith("data-"))] | sort_by(.createdAt) | last | .tagName')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::no data-* release: run scripts/publish-data.sh first"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern site-data.tar.gz --dir /tmp

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the static app
        working-directory: web
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_OUTPUTS_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.data.outputs.tag }}/outputs.tar.xz
        run: |
          npm ci --no-audit --no-fund
          npm run build
          tar -xzf /tmp/site-data.tar.gz -C dist
          test -f dist/data/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
