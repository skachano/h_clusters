services:
  worker:
    build:
      context: ./worker
    image: hclust-worker:dev
    profiles: [compute]
    environment:
      HOME: /tmp
      HCLUST_SCRATCH: /scratch
    volumes:
      # ORCA's licence forbids redistribution: mount it, never bake it in.
      - ${ORCA_DIR:-/opt/orca}:/opt/orca:ro
      - ./data:/data
      - ./worker:/app
      - ./campaigns:/campaigns:ro
      # ORCA runs here; CCSD(T) on H9/H10 needs ~12 GB per job (doc/Plan.md, Phase 4).
      - ${SCRATCH_DIR:-/var/tmp/hclust}:/scratch
    working_dir: /app

  # Read-only HTTP API over data/hclust.sqlite: http://localhost:8000/docs
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: hclust-api:dev
    profiles: [serve, prod]
    environment:
      HCLUST_DATA: /data
    volumes:
      # Writable on purpose: SQLite WAL readers need the -shm file. The API opens the
      # database with mode=ro, so SQLite itself refuses writes (doc/Plan.md, Phase 6).
      - ./data:/data
      - ./api:/app
      - ./worker/src:/hclust/src:ro
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    command: >-
      uvicorn --factory hclust_api.main:create_app --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/src --reload-dir /hclust/src

  # Web app, development server with hot reload: http://localhost:5173
  web:
    build:
      context: ./web
      target: dev
    image: hclust-web:dev
    profiles: [serve]
    environment:
      API_PROXY: http://api:8000
    volumes:
      - ./web:/app
      - ./api/openapi.json:/api/openapi.json:ro  # npm run gen:api reads ../api/openapi.json
      - ./wiki/pages:/wiki/pages:ro  # the tests check that the app's wiki links exist
      - /app/node_modules  # the image's, not the host's
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:5173"
    depends_on: [api]

  # Production build served by nginx (also proxies /api): http://localhost:8080
  web-prod:
    build:
      context: ./web
      target: prod
    image: hclust-web:prod
    profiles: [prod]
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PROD_PORT:-8080}:80"
    depends_on: [api]

  # The GitHub Pages build (doc/Plan.md, Phase 9) served as Pages would, under /<repo>/, with
  # the exported data from data/site/data: http://localhost:4173/h_clusters/
  #   docker compose --profile serve run --rm --no-deps api python -m hclust_api.export --out /data/site/data
  #   docker compose --profile static up web-static
  web-static:
    image: hclust-web:dev
    profiles: [static]
    environment:
      VITE_STATIC: "1"
      VITE_BASE: /h_clusters/
    volumes:
      - ./web:/app
      - /app/node_modules
      - ./data/site/data:/site-data:ro
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_STATIC_PORT:-4173}:4173"
    command: >-
      sh -c "npx tsc -b && npx vite build --outDir /tmp/site/h_clusters --emptyOutDir
      && cp -r /site-data /tmp/site/h_clusters/data
      && npx vite preview --outDir /tmp/site/h_clusters --host --port 4173 --strictPort"

  # Browser smoke test (Plan §6) against the running serve stack:
  #   docker compose --profile serve up -d && docker compose --profile test run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-noble  # matches @playwright/test in web/package.json
    profiles: [test]
    environment:
      E2E_BASE_URL: http://web:5173
    volumes:
      - ./web:/app
    working_dir: /app
    command: npx playwright test
    # The static build instead: docker compose --profile static up -d web-static, then
    #   docker compose --profile test run --rm -e E2E_STATIC=1 \
    #     -e E2E_BASE_URL=http://web-static:4173/h_clusters/ e2e

  # Learning wiki (wiki/). Live preview: docker compose --profile docs up docs
  docs:
    build:
      context: ./wiki
    image: hclust-docs:dev
    profiles: [docs]
    ports:
      - "${DOCS_BIND:-127.0.0.1}:${DOCS_PORT:-8001}:8000"
    volumes:
      - ./wiki:/docs
