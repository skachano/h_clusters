services:
  worker:
    build:
      context: ./worker
    image: hclust-worker:dev
    profiles: [compute]
    environment:
      HOME: /tmp
    volumes:
      # ORCA's licence forbids redistribution: mount it, never bake it in.
      - ${ORCA_DIR:-/opt/orca}:/opt/orca:ro
      - ./data:/data
      - ./worker:/app
      - ./campaigns:/campaigns:ro
    working_dir: /app

  # Learning wiki (wiki/). Live preview: docker compose --profile docs up docs
  docs:
    build:
      context: ./wiki
    image: hclust-docs:dev
    profiles: [docs]
    ports:
      - "127.0.0.1:${DOCS_PORT:-8001}:8000"
    volumes:
      - ./wiki:/docs
