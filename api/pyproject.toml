[project]
name = "hclust-api"
version = "0.1.0"
description = "Read-only HTTP API over the hclust results database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "hclust",
]

[tool.uv.sources]
# The analysis lives in the worker package; the container mounts its source (compose.yaml).
hclust = { path = "../worker", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hclust_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
